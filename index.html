<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Моя игра</title>
</head>
<body>
<h1>🎮 Лови квадрат</h1>

<p>Очки: <span id="score">0</span></p>
<p>Время: <span id="time">30</span></p>

<div id="game">
    <div id="square"></div>
</div>
<button id="restart">Играть снова</button>

<style>
    #game {
        width: 500px;
        height: 400px;
        border: 3px solid black;
        position: relative;
    }
    #square {
    width: 50px;
    height: 50px;
    background: blue;
        position: absolute;
}
</style>
</body>
<script>
    let score = 0;
   let time = 30;
let timer;
let started = false;

    document.getElementById("square").onclick = function() {
        if (started === false) {
    started = true;

    timer = setInterval(function() {
        time = time - 1;
        document.getElementById("time").textContent = time;

        if (time === 0) {
            clearInterval(timer);
            alert("Игра окончена! Твои очки: " + score);
        }
    }, 1000);
}
        score = score + 1;
        document.getElementById("score").textContent = score;
        let x = Math.random() * 450;
        let y = Math.random() * 350;

        document.getElementById("square").style.left = x + "px";
        document.getElementById("square").style.top = y + "px";
    };
    document.getElementById("restart").onclick = function() {
    location.reload();
};
</script>
</body>
</html>
